# 저장소에 변경이 생기면 홈페이지를 자동으로 다시 만들어 공개합니다.
name: 홈페이지 자동 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: 홈페이지 만들기
        env:
          PUBLISH: "1"
          SITE_URL: "https://www.stvision.co.kr"
        run: |
          cd 01_시안
          python build_preview.py
          python publish.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 01_시안/_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
